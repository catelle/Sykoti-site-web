<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#243447"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d94a4a"/>
    </marker>
    <style>
      .title { font: 700 30px "Comic Sans MS", "Segoe Print", cursive; fill: #242424; }
      .subtitle { font: 18px "Comic Sans MS", "Segoe Print", cursive; fill: #555; }
      .lane-title { font: 700 21px "Comic Sans MS", "Segoe Print", cursive; fill: #242424; }
      .step { font: 700 16px "Comic Sans MS", "Segoe Print", cursive; fill: #242424; }
      .body { font: 15px "Comic Sans MS", "Segoe Print", cursive; fill: #242424; }
      .small { font: 13px "Comic Sans MS", "Segoe Print", cursive; fill: #444; }
      .label { font: 700 15px "Comic Sans MS", "Segoe Print", cursive; fill: #e22d2d; }
      .box { fill: #fff; stroke: #242424; stroke-width: 3; rx: 18; }
      .branch { fill: #fff; stroke: #242424; stroke-width: 3; rx: 18; }
      .decision { fill: #fff; stroke: #242424; stroke-width: 3; }
      .lane { fill: none; stroke: #242424; stroke-width: 3; stroke-dasharray: 12 10; rx: 24; }
      .lane-head { fill: none; stroke: none; }
      .line { fill: none; stroke: #242424; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #e22d2d; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 10 9; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#fffefa"/>
  <text x="70" y="62" class="title">Processus d'approvisionnement — de la demande à la vente</text>
  <text x="70" y="94" class="subtitle">Lecture de la table : acteurs, sociétés et documents Odoo à chaque étape</text>

  <!-- Lanes -->
  <rect x="55" y="135" width="1690" height="170" class="lane"/>
  <rect x="55" y="135" width="190" height="170" class="lane-head" rx="18"/>
  <text x="150" y="205" text-anchor="middle" class="lane-title">1. Demande</text>
  <text x="150" y="235" text-anchor="middle" class="lane-title">et arbitrage</text>

  <rect x="55" y="330" width="1690" height="345" class="lane"/>
  <rect x="55" y="330" width="190" height="345" class="lane-head" rx="18"/>
  <text x="150" y="477" text-anchor="middle" class="lane-title">2. Exécution</text>
  <text x="150" y="507" text-anchor="middle" class="lane-title">de l'achat</text>

  <rect x="55" y="700" width="1690" height="350" class="lane"/>
  <rect x="55" y="700" width="190" height="350" class="lane-head" rx="18"/>
  <text x="150" y="847" text-anchor="middle" class="lane-title">3. Réception,</text>
  <text x="150" y="877" text-anchor="middle" class="lane-title">contrôle et vente</text>

  <!-- Main nodes -->
  <rect x="285" y="175" width="230" height="95" class="box"/>
  <text x="400" y="205" text-anchor="middle" class="step">Étape 1</text>
  <text x="400" y="230" text-anchor="middle" class="body">Exprimer le besoin</text>
  <text x="400" y="251" text-anchor="middle" class="small">produit + quantité</text>
  <text x="400" y="292" text-anchor="middle" class="small">Chef boutique · DA</text>

  <rect x="600" y="175" width="245" height="95" class="box"/>
  <text x="722" y="205" text-anchor="middle" class="step">Étape 2</text>
  <text x="722" y="230" text-anchor="middle" class="body">Arbitrer chaque ligne</text>
  <text x="722" y="251" text-anchor="middle" class="small">MAITHE ou dropshipping</text>
  <text x="722" y="292" text-anchor="middle" class="small">Dispatcher · lignes de la DA</text>

  <polygon points="930,175 1060,222 930,269 800,222" class="decision"/>
  <text x="930" y="218" text-anchor="middle" class="step">Mode choisi ?</text>
  <text x="930" y="241" text-anchor="middle" class="small">magasin / fournisseur</text>

  <!-- Branches -->
  <rect x="1085" y="355" width="270" height="120" class="branch"/>
  <text x="1220" y="385" text-anchor="middle" class="step">3a · Cas magasin</text>
  <text x="1220" y="411" text-anchor="middle" class="body">Approuver les documents</text>
  <text x="1220" y="432" text-anchor="middle" class="body">interco générés</text>
  <text x="1220" y="457" text-anchor="middle" class="small">Dispatcher automatique · les deux sociétés</text>

  <rect x="1430" y="355" width="270" height="120" class="branch"/>
  <text x="1565" y="385" text-anchor="middle" class="step">3b · Dropshipping</text>
  <text x="1565" y="411" text-anchor="middle" class="body">Confirmer l'achat</text>
  <text x="1565" y="432" text-anchor="middle" class="body">au fournisseur</text>
  <text x="1565" y="457" text-anchor="middle" class="small">Acheteur MAITHE · BDC fournisseur</text>

  <rect x="760" y="530" width="270" height="105" class="box"/>
  <text x="895" y="558" text-anchor="middle" class="step">4 · Préparer et livrer</text>
  <text x="895" y="584" text-anchor="middle" class="body">Cas magasin MAITHE</text>
  <text x="895" y="608" text-anchor="middle" class="small">Magasinier MAITHE · bon de livraison</text>

  <rect x="1125" y="730" width="260" height="105" class="box"/>
  <text x="1255" y="758" text-anchor="middle" class="step">5 · Réceptionner</text>
  <text x="1255" y="784" text-anchor="middle" class="body">en réserve</text>
  <text x="1255" y="808" text-anchor="middle" class="small">Chef boutique · réception du BDC</text>

  <rect x="755" y="895" width="285" height="115" class="box"/>
  <text x="897" y="923" text-anchor="middle" class="step">6 · Valider les factures</text>
  <text x="897" y="948" text-anchor="middle" class="body">jumelles, créées en brouillon</text>
  <text x="897" y="976" text-anchor="middle" class="small">Comptables des deux sociétés</text>
  <text x="897" y="997" text-anchor="middle" class="small">facture client + facture fournisseur</text>

  <rect x="355" y="895" width="285" height="115" class="box"/>
  <text x="497" y="923" text-anchor="middle" class="step">7 · Arbitrer un écart</text>
  <text x="497" y="948" text-anchor="middle" class="body">livré / reçu</text>
  <text x="497" y="976" text-anchor="middle" class="small">Contrôle de gestion · MAITHE</text>
  <text x="497" y="997" text-anchor="middle" class="small">vente « écart de réception »</text>

  <rect x="1150" y="895" width="285" height="115" class="box"/>
  <text x="1292" y="923" text-anchor="middle" class="step">8 · Transférer</text>
  <text x="1292" y="948" text-anchor="middle" class="body">réserve → rayon</text>
  <text x="1292" y="976" text-anchor="middle" class="small">Chef boutique → fille boutique</text>
  <text x="1292" y="997" text-anchor="middle" class="small">transfert interne</text>

  <rect x="1500" y="895" width="200" height="115" class="box"/>
  <text x="1600" y="923" text-anchor="middle" class="step">9 · Vendre</text>
  <text x="1600" y="948" text-anchor="middle" class="body">et encaisser</text>
  <text x="1600" y="976" text-anchor="middle" class="small">Caissière · caisse</text>
  <text x="1600" y="997" text-anchor="middle" class="small">tickets</text>

  <!-- Connectors -->
  <path d="M515 222 H600" class="line"/>
  <path d="M845 222 H800" class="line"/>
  <path d="M930 269 V330 H1220 V355" class="line"/>
  <text x="1035" y="317" class="label">MAITHE</text>
  <path d="M930 269 V330 H1565 V355" class="line"/>
  <text x="1395" y="317" class="label">DROPSHIPPING</text>
  <path d="M1220 475 V530 H895" class="line"/>
  <path d="M1565 475 V515 H895 V530" class="line"/>
  <path d="M895 635 V680 H1255 V730" class="line"/>
  <path d="M1255 835 V865 H897 V895" class="line"/>
  <path d="M755 952 H640" class="line"/>
  <path d="M1040 952 H1150" class="line"/>
  <path d="M1435 952 H1500" class="line"/>

  <!-- Feedback loop -->
  <path d="M497 895 V850 H690 V640" class="dash"/>
  <text x="505" y="835" class="label">écart à traiter</text>
  <path d="M640 952 V1040 H1470 V865" class="dash"/>
  <text x="750" y="1075" class="label">Après arbitrage : poursuivre le flux</text>

  <!-- Legend -->
  <line x1="75" y1="1080" x2="125" y2="1080" stroke="#243447" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="135" y="1086" class="small">flux principal</text>
  <line x1="300" y1="1080" x2="350" y2="1080" stroke="#d94a4a" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
  <text x="360" y="1086" class="small">écart / retour de contrôle</text>
</svg>
